<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1260" width="1040" height="1260">
  <!-- Figure 4: decision flow from sensing to misting. Values match climate/src/shelter.cpp (deployment preset). -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2a24"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7a72"/>
    </marker>
    <style>
      text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #1f2a24; }
      .t { font-size: 16px; font-weight: 600; }
      .d { font-size: 15px; font-weight: 600; }
      .s { font-size: 13px; fill: #5d6b64; }
      .yn { font-size: 13px; fill: #6b7a72; font-style: italic; }
      .band { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #44524b; }
      .bandsub { font-size: 11.5px; fill: #7d8a84; }
      .end { font-size: 15px; font-weight: 600; fill: #4d5a54; }
      .ends { font-size: 12.5px; fill: #6b7a72; }
      .light { fill: #ffffff; }
      .lightsub { fill: #d4e4f1; }
      .safe { font-size: 13.5px; font-weight: 700; fill: #b3362a; }
      .safes { font-size: 12.5px; fill: #6b4a46; }
      .flow { stroke: #1f2a24; stroke-width: 1.6; fill: none; }
      .flowm { stroke: #6b7a72; stroke-width: 1.6; fill: none; }
      .box { fill: #ffffff; stroke: #1f2a24; stroke-width: 1.5; }
      .dec { fill: #eaf2f8; stroke: #1f5f8b; stroke-width: 1.5; }
      .out { fill: #f1f2f1; stroke: #a3ada8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect width="1040" height="1260" fill="#ffffff"/>
  <rect x="0" y="250" width="1040" height="570" fill="#f5f7f6"/>
  <rect x="0" y="1000" width="1040" height="260" fill="#f5f7f6"/>

  <!-- phase labels -->
  <g transform="translate(40,125) rotate(-90)"><text class="band" text-anchor="middle">DETECT</text><text class="bandsub" y="17" text-anchor="middle">controller</text></g>
  <g transform="translate(40,535) rotate(-90)"><text class="band" text-anchor="middle">IDENTIFY</text><text class="bandsub" y="17" text-anchor="middle">camera, console and AI API</text></g>
  <g transform="translate(40,910) rotate(-90)"><text class="band" text-anchor="middle">DECIDE</text><text class="bandsub" y="17" text-anchor="middle">controller</text></g>
  <g transform="translate(40,1130) rotate(-90)"><text class="band" text-anchor="middle">ACT</text><text class="bandsub" y="17" text-anchor="middle">controller</text></g>

  <!-- detect -->
  <rect x="410" y="44" width="300" height="52" rx="26" fill="#1f2a24"/>
  <text class="t light" x="560" y="75.5" text-anchor="middle">A bird lands on the perch</text>
  <path class="flow" d="M560 96 V140" marker-end="url(#a)"/>
  <rect class="box" x="410" y="140" width="300" height="70" rx="8"/>
  <text class="t" x="560" y="170" text-anchor="middle">Perch sensor detects a landing</text>
  <text class="s" x="560" y="192" text-anchor="middle">reading jumps 300+ above its usual level</text>
  <path class="flow" d="M560 210 V268" marker-end="url(#a)"/>

  <!-- identify -->
  <polygon class="dec" points="560,268 710,320 560,372 410,320"/>
  <text class="d" x="560" y="316" text-anchor="middle">Console and AI</text>
  <text class="d" x="560" y="335" text-anchor="middle">reachable?</text>

  <path class="flow" d="M410 320 H340" marker-end="url(#a)"/>
  <text class="yn" x="375" y="311" text-anchor="middle">no</text>
  <rect class="box" x="130" y="288" width="210" height="64" rx="8" stroke-dasharray="5 4"/>
  <text class="t" x="235" y="315" text-anchor="middle">Perch-only fallback</text>
  <text class="s" x="235" y="336" text-anchor="middle">the landing counts as a bird</text>
  <path class="flowm" d="M235 352 V910 H390" marker-end="url(#am)"/>

  <path class="flow" d="M560 372 V410" marker-end="url(#a)"/>
  <text class="yn" x="572" y="396">yes</text>
  <rect class="box" x="410" y="410" width="300" height="64" rx="8"/>
  <text class="t" x="560" y="437" text-anchor="middle">Camera takes a photo</text>
  <text class="s" x="560" y="458" text-anchor="middle">640 × 480 JPEG over WiFi</text>
  <path class="flow" d="M560 474 V500" marker-end="url(#a)"/>
  <rect class="box" x="410" y="500" width="300" height="64" rx="8"/>
  <text class="t" x="560" y="527" text-anchor="middle">AI API checks the photo</text>
  <text class="s" x="560" y="548" text-anchor="middle">returns bird, species and confidence</text>
  <path class="flow" d="M560 564 V600" marker-end="url(#a)"/>

  <polygon class="dec" points="560,600 690,650 560,700 430,650"/>
  <text class="d" x="560" y="647" text-anchor="middle">Bird found?</text>
  <text class="s" x="560" y="666" text-anchor="middle">confidence ≥ 0.5</text>
  <path class="flow" d="M690 650 H762" marker-end="url(#a)"/>
  <text class="yn" x="726" y="641" text-anchor="middle">no</text>
  <rect class="out" x="762" y="622" width="240" height="56" rx="28"/>
  <text class="end" x="882" y="646" text-anchor="middle">Not a bird</text>
  <text class="ends" x="882" y="664" text-anchor="middle">ignored, no misting</text>

  <path class="flow" d="M560 700 V728" marker-end="url(#a)"/>
  <text class="yn" x="572" y="718">yes</text>
  <rect class="box" x="410" y="728" width="300" height="56" rx="8"/>
  <text class="t" x="560" y="761.5" text-anchor="middle">Save the visit with its species</text>
  <path class="flow" d="M560 784 V838" marker-end="url(#a)"/>

  <!-- decide -->
  <polygon class="dec" points="560,838 730,910 560,982 390,910"/>
  <text class="d" x="560" y="893" text-anchor="middle">Daytime, at least 30 °C,</text>
  <text class="d" x="560" y="912" text-anchor="middle">humidity below 75 %</text>
  <text class="d" x="560" y="931" text-anchor="middle">and water in the tank?</text>
  <path class="flow" d="M730 910 H762" marker-end="url(#a)"/>
  <text class="yn" x="746" y="900" text-anchor="middle">no</text>
  <rect class="out" x="762" y="882" width="240" height="56" rx="28"/>
  <text class="end" x="882" y="906" text-anchor="middle">Keep waiting</text>
  <text class="ends" x="882" y="924" text-anchor="middle">no misting for now</text>
  <path class="flow" d="M560 982 V1030" marker-end="url(#a)"/>
  <text class="yn" x="572" y="1011">yes</text>

  <!-- act -->
  <rect x="410" y="1030" width="300" height="64" rx="8" fill="#1f5f8b"/>
  <text class="t light" x="560" y="1057" text-anchor="middle">Mist in pulses</text>
  <text class="s lightsub" x="560" y="1078" text-anchor="middle">20 s on, 60 s off</text>

  <path d="M710 1062 H762" stroke="#b3362a" stroke-width="1.3" stroke-dasharray="2 4" fill="none"/>
  <rect x="762" y="1014" width="240" height="96" rx="8" fill="#fbf2f1" stroke="#b3362a" stroke-width="1.3" stroke-dasharray="6 4"/>
  <text class="safe" x="780" y="1040">Safety limits, always on</text>
  <text class="safes" x="780" y="1061">at most 30 s per spray</text>
  <text class="safes" x="780" y="1079">at most 300 s per hour</text>
  <text class="safes" x="780" y="1097">stops in 20 ms if the tank is dry</text>

  <path class="flow" d="M560 1094 V1124" marker-end="url(#a)"/>
  <polygon class="dec" points="560,1124 710,1176 560,1228 410,1176"/>
  <text class="d" x="560" y="1172" text-anchor="middle">Still needed?</text>
  <text class="s" x="560" y="1191" text-anchor="middle">bird, heat, daylight, water</text>

  <path class="flow" d="M410 1176 H372 V1062 H410" marker-end="url(#a)"/>
  <text class="yn" x="391" y="1168" text-anchor="middle">yes</text>

  <path class="flow" d="M710 1176 H762" marker-end="url(#a)"/>
  <text class="yn" x="736" y="1167" text-anchor="middle">no</text>
  <rect class="out" x="762" y="1141" width="240" height="70" rx="14"/>
  <text class="end" x="882" y="1165" text-anchor="middle">Stop misting</text>
  <text class="ends" x="882" y="1184" text-anchor="middle">28 °C or less, 80 % humidity,</text>
  <text class="ends" x="882" y="1200" text-anchor="middle">night, no water, or bird gone 30 s</text>
</svg>
