[platformio]
default_envs = shelter

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SHT31 Library
    claws/BH1750

[env:bringup]
build_src_filter = +<bringup.cpp>

[env:hardware_test]
build_src_filter = +<hardware_test.cpp>
lib_deps =

[env:bus_test]
build_src_filter = +<bus_test.cpp>
lib_deps =

[env:dfrobot_firebeetle2_esp32e]
build_src_filter = +<main.cpp>

; Final prototype firmware used by the Shelter console (app/shelter_console.py).
[env:shelter]
build_src_filter = +<shelter.cpp>
lib_deps =
lib_extra_dirs = ../common
; WiFi + Bluetooth set-up need more than the default 1.25 MB app slot; still two slots for OTA.
board_build.partitions = min_spiffs.csv

; Same firmware, uploaded over WiFi once the board has joined the network.
[env:shelter_ota]
extends = env:shelter
upload_protocol = espota
upload_port = shelter-climate.local
upload_flags = --auth=shelter5047
; macOS "Local Network" privacy blocks PlatformIO's own Python from reaching the board; the system one is allowed
upload_command = /usr/bin/python3 $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/espota.py $UPLOAD_FLAGS -i $UPLOAD_PORT -f $SOURCE
