[platformio]
default_envs = shelter_cam

[env:dfr1154]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
build_src_filter = +<main.cpp>

; Final camera firmware used by the Shelter console (USB or WiFi).
[env:shelter_cam]
extends = env:dfr1154
build_src_filter = +<shelter_cam.cpp>
lib_extra_dirs = ../common

[env:shelter_cam_ota]
extends = env:shelter_cam
upload_protocol = espota
upload_port = shelter-camera.local
upload_flags = --auth=shelter5047
; macOS "Local Network" privacy blocks PlatformIO's own Python from reaching the board; the system one is allowed
upload_command = /usr/bin/python3 $PROJECT_PACKAGES_DIR/framework-arduinoespressif32/tools/espota.py $UPLOAD_FLAGS -i $UPLOAD_PORT -f $SOURCE
